  <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .meditation-bg { background: #ebbb45; min-height: 100vh; width: 100%; }
        .timer-text { font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgba(0,0,0,0.15); transition: color 1.5s ease; }
        .pulse-active { animation: timerPulse 2s ease-in-out infinite; }
        .pulse-complete { animation: timerPulseRapid 0.6s ease-in-out infinite; }
        @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes timerPulseRapid { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .btn-primary { backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); text-align: center; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); text-align: center; }
        .btn-secondary:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
        .btn-secondary:active { transform: translateY(0); }
        .session-label { letter-spacing: 0.25em; text-transform: uppercase; }
        .duration-btn { background: rgba(255,255,255,0.25); color: #372e18; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s ease; }
        .duration-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
        .duration-btn:active { transform: translateY(0); }
        .duration-btn.active { background: rgba(255,255,255,0.5); font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .timer-ring { position: absolute; width: 352px; height: 352px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.08); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
        .timer-ring-outer { width: 418px; height: 418px; border-color: rgba(255,255,255,0.04); }
        #timer-wrapper { transition: all 0.6s cubic-bezier(0.4,0,0.2,1); }
        #timer-wrapper.timer-centered { position: relative; margin-bottom: 0; }
        @media (max-width: 640px) {
            .timer-ring { width: 264px; height: 264px; }
            .timer-ring-outer { width: 319px; height: 319px; }
        }
        :root { --fg: #ffffff; --fg-soft: rgba(255,255,255,0.7); }
        #settings-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; z-index: 30; width: 44px; height: 44px; border-radius: 9999px; background: rgba(255,255,255,0.25); color: var(--fg); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.3s ease; }
        #settings-btn:hover { background: rgba(255,255,255,0.35); transform: rotate(30deg); }
        #settings-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; padding: 16px; }
        #settings-overlay.open { display: flex; }
        #settings-panel { background: #ffffff; color: #372e18; border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-height: 90%; overflow-y: auto; }
        .set-label { font-size: 13px; font-weight: 700; margin: 18px 0 8px; opacity: 0.7; }
        .lang-btn, .sound-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #e5e5e5; background: #ffffff; font-weight: 600; cursor: pointer; color: #372e18; }
        .lang-btn.active, .sound-btn.active { border-color: #372e18; background: #f6efe0; }
        .swatch { width: 40px; height: 40px; border-radius: 9999px; border: 3px solid #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); cursor: pointer; }
        .swatch.active { box-shadow: 0 0 0 3px #372e18; }
        #noodle-alert { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); transform: translateX(-50%); z-index: 20; background: #ffffff; color: #372e18; border-radius: 20px; padding: 16px 28px; font-size: 20px; font-weight: 800; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.3); max-width: 90%; cursor: pointer; display: none; }
        #noodle-alert.show { display: block; animation: noodlePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes noodlePop { 0% { transform: translateX(-50%) scale(0.6); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
        .time-input { width: 72px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.25); color: #372e18; font-weight: 700; font-size: 16px; text-align: center; outline: none; -moz-appearance: textfield; appearance: textfield; }
        .time-input::-webkit-inner-spin-button, .time-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .time-input::placeholder { color: rgba(55,46,24,0.45); }
        .time-input:focus { background: rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.8); }

        .set-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
        .set-btn:active { transform: translateY(0); }
    </style>

  <script>
        const TOTAL_SECONDS = 0;
        let remainingSeconds = TOTAL_SECONDS;
        let selectedDuration = TOTAL_SECONDS;
        let timerInterval = null;
        let isRunning = false;
        let hasStarted = false;

        const timerDisplay = document.getElementById('timer-display');
        const timerWrapper = document.getElementById('timer-wrapper');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const durationSelector = document.getElementById('duration-selector');
        const durationBtns = document.querySelectorAll('.duration-btn');

        durationBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                stopAlarm();
                timerWrapper.classList.remove('pulse-complete');
                const minutes = parseInt(btn.dataset.minutes, 10);
                if (btn.dataset.seconds) {
                    const add = parseInt(btn.dataset.seconds, 10);
                    selectedDuration += add;
                    remainingSeconds += add;
                } else {
                    selectedDuration += minutes * 60;
                    remainingSeconds += minutes * 60;
                }
                // buttons add time, so no "selected" highlight
                updateDisplay();
            });
        });

        startBtn.addEventListener('click', () => {
            if (!isRunning) { if (inMin.value || inSec.value) applyTimeInput(); startTimerSession(); } else pauseTimer();
        });
        resetBtn.addEventListener('click', () => reset());

        updateDisplay();

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);
            timerDisplay.style.color = 'var(--fg)';
            try { updateNoodleSoundVisibility(); } catch (e) {}
        }

        let audioCtx = null;

        // iPad/iPhone only allow sound after a tap, so unlock audio on Start
        function unlockAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                // play a silent blip to fully unlock iOS audio
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                g.gain.value = 0.0001;
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playCompletionTone() {
            vibrateNow();
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const ctx = audioCtx;
                (SOUNDS[settings.sound] || SOUNDS.bell)(ctx);
            } catch (e) {}
        }

        let alarmInterval = null;

        function startAlarm() {
            stopAlarm();
            playCompletionTone();
            alarmInterval = setInterval(playCompletionTone, 1500);
        }

        function stopAlarm() {
            try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
            const noodle = document.getElementById('noodle-alert');
            if (noodle) noodle.classList.remove('show');
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function onComplete() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            timerWrapper.classList.remove('pulse-active');
            timerWrapper.classList.add('pulse-complete');
            durationSelector.style.opacity = '1';
            durationSelector.style.pointerEvents = 'auto';
            startAlarm();
            setStartState('start');
            maybeNoodle();
        }

        function tick() {
            if (remainingSeconds <= 0) { onComplete(); return; }
            remainingSeconds--;
            updateDisplay();
            if (remainingSeconds <= 0) onComplete();
        }

        function startTimerSession() {
            if (remainingSeconds <= 0) return;
            unlockAudio();
            isRunning = true;
            hasStarted = true;
            timerWrapper.classList.add('pulse-active', 'timer-centered');
            durationSelector.style.opacity = '0';
            durationSelector.style.pointerEvents = 'none';
            setStartState('pause');
            timerInterval = setInterval(tick, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            timerWrapper.classList.remove('pulse-active');
            durationSelector.style.opacity = '1';
            durationSelector.style.pointerEvents = 'auto';
            setStartState('resume');
        }

        function reset() {
            isRunning = false;
            hasStarted = false;
            clearInterval(timerInterval);
            timerInterval = null;
            stopAlarm();
            inMin.value = '';
            inSec.value = '';
            selectedDuration = TOTAL_SECONDS;
            remainingSeconds = TOTAL_SECONDS;
            durationBtns.forEach(b => b.classList.remove('active'));
            timerWrapper.classList.remove('pulse-active', 'pulse-complete', 'timer-centered');
            timerDisplay.style.color = '';
            durationSelector.style.opacity = '1';
            durationSelector.style.pointerEvents = 'auto';
            setStartState('start');
            updateDisplay();
        }

            de: { start: 'Start', pause: 'Pause', resume: 'Weiter', reset: 'Zurücksetzen', sec: 's', min: 'm', settings: 'Einstellungen', language: 'Sprache', background: 'Hintergrundfarbe', custom: 'Eigene Farbe', close: 'Schließen', sound: 'Klang', vibration: 'Vibration', unit_min: 'Min', unit_sec: 'Sek', set: 'Setzen', noodle_btn: 'Instantnudeln', noodle: 'Deine Instantnudeln sind fertig! 🍜', snd_bell: 'Glocke', snd_chime: 'Glockenspiel', snd_beep: 'Piepton', snd_digital: 'Digital', snd_gong: 'Gong', snd_marimba: 'Marimba', snd_harp: 'Harfe', snd_alarm: 'Alarm', snd_drop: 'Wassertropfen', snd_coin: 'Retro-Münze', snd_laser: 'Laser', snd_ufo: 'UFO', snd_heartbeat: 'Herzschlag', snd_siren: 'Sirene', snd_alert: 'Notfallalarm', snd_fire: 'Feueralarm' },
            pt: { start: 'Iniciar', pause: 'Pausar', resume: 'Continuar', reset: 'Redefinir', sec: 's', min: 'm', settings: 'Configurações', language: 'Idioma', background: 'Cor de fundo', custom: 'Cor personalizada', close: 'Fechar', sound: 'Som', vibration: 'Vibração', unit_min: 'min', unit_sec: 's', set: 'Definir', noodle_btn: 'Macarrão instantâneo', noodle: 'Seu macarrão instantâneo está pronto! 🍜', snd_bell: 'Sino', snd_chime: 'Carrilhão', snd_beep: 'Bipe', snd_digital: 'Digital', snd_gong: 'Gongo', snd_marimba: 'Marimba', snd_harp: 'Harpa', snd_alarm: 'Alarme', snd_drop: 'Gota d’água', snd_coin: 'Moeda retrô', snd_laser: 'Laser', snd_ufo: 'OVNI', snd_heartbeat: 'Batimento', snd_siren: 'Sirene', snd_alert: 'Alerta de emergência', snd_fire: 'Alarme de incêndio' }
        };
        const COLORS = ['#ebbb45', '#e07a5f', '#f4a6c0', '#8e6fd1', '#5b8def', '#6fb7a8', '#7bb661', '#2f3640'];
        function tone(ctx, freq, start, dur, vol, type, attack) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t0 = ctx.currentTime + start;
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + (attack || 0.02));
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }

        function sweep(ctx, f0, f1, start, dur, vol, type) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t0 = ctx.currentTime + start;
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(f0, t0);
            osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }

        const SOUNDS = {
            bell:    ctx => { tone(ctx, 528, 0, 0.8, 0.6); tone(ctx, 792, 0, 0.8, 0.3); },
            chime:   ctx => { tone(ctx, 880, 0, 1.2, 0.35, 'sine', 0.05); tone(ctx, 1320, 0.05, 1.0, 0.15, 'sine', 0.05); },
            beep:    ctx => { tone(ctx, 880, 0, 0.15, 0.25, 'square'); tone(ctx, 880, 0.25, 0.15, 0.25, 'square'); },
            digital: ctx => { tone(ctx, 660, 0, 0.15, 0.3, 'triangle'); tone(ctx, 880, 0.15, 0.15, 0.3, 'triangle'); tone(ctx, 1100, 0.3, 0.2, 0.3, 'triangle'); },
            gong:    ctx => { tone(ctx, 196, 0, 1.4, 0.6, 'sine', 0.03); tone(ctx, 294, 0, 1.2, 0.3, 'sine', 0.03); tone(ctx, 392, 0, 1.0, 0.2, 'sine', 0.03); },
            marimba: ctx => { tone(ctx, 523, 0, 0.35, 0.5, 'triangle', 0.005); tone(ctx, 659, 0.12, 0.35, 0.5, 'triangle', 0.005); tone(ctx, 784, 0.24, 0.5, 0.5, 'triangle', 0.005); },
            harp:    ctx => { [392, 523, 659, 784, 1047].forEach((f, i) => tone(ctx, f, i * 0.09, 0.8, 0.3, 'sine', 0.01)); },
            alarm:   ctx => { [880, 660, 880, 660].forEach((f, i) => tone(ctx, f, i * 0.14, 0.12, 0.18, 'sawtooth', 0.005)); },
            drop:    ctx => { sweep(ctx, 350, 1100, 0, 0.12, 0.5, 'sine'); sweep(ctx, 300, 900, 0.3, 0.12, 0.25, 'sine'); },
            coin:    ctx => { tone(ctx, 988, 0, 0.08, 0.25, 'square', 0.003); tone(ctx, 1319, 0.08, 0.45, 0.25, 'square', 0.003); },
            laser:   ctx => { sweep(ctx, 1800, 150, 0, 0.35, 0.25, 'sawtooth'); sweep(ctx, 1800, 150, 0.45, 0.35, 0.25, 'sawtooth'); },
            ufo:     ctx => {
                const t0 = ctx.currentTime;
                const osc = ctx.createOscillator();
                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 700;
                lfo.frequency.value = 9;
                lfoGain.gain.value = 250;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t0);
                lfo.start(t0);
                osc.stop(t0 + 1.25);
                lfo.stop(t0 + 1.25);
            },
            heartbeat: ctx => { sweep(ctx, 160, 50, 0, 0.18, 0.9, 'sine'); sweep(ctx, 160, 50, 0.25, 0.22, 0.7, 'sine'); },
            alert: ctx => { [0, 0.35, 0.7].forEach(s => { tone(ctx, 853, s, 0.28, 0.3, 'sine', 0.005); tone(ctx, 960, s, 0.28, 0.3, 'sine', 0.005); }); },
            noodle: ctx => {
                // simmering pot: low rumbling noise + random bubbles
                const dur = 1.4;
                const len = Math.floor(ctx.sampleRate * dur);
                const buf = ctx.createBuffer(1, len, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 500;
                const g = ctx.createGain();
                const t0 = ctx.currentTime;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.1);
                g.gain.setValueAtTime(0.25, t0 + 1.2);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                src.connect(filter);
                filter.connect(g);
                g.connect(ctx.destination);
                src.start(t0);
                for (let i = 0; i < 16; i++) {
                    const f0 = 180 + Math.random() * 300;
                    sweep(ctx, f0, f0 * (2 + Math.random()), Math.random() * 1.25, 0.06 + Math.random() * 0.08, 0.2 + Math.random() * 0.2, 'sine');
                }
            }
        };

        let settings = { lang: 'en', bg: '#ebbb45', sound: 'bell', vibrate: true };

        function vibrateNow() {
            try {
                if (settings.vibrate && navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch (e) {}
        }
        let startState = 'start';

        const settingsOverlay = document.getElementById('settings-overlay');
        const swatchesEl = document.getElementById('swatches');
        const customColor = document.getElementById('custom-color');

        function t(key) { return I18N[settings.lang][key]; }

        function setStartState(s) {
            startState = s;
            startBtn.textContent = t(s);
        }

        function saveSettings() {
            try { localStorage.setItem('meditation-settings', JSON.stringify(settings)); } catch (e) {}
        }

        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem('meditation-settings') || 'null');
                if (saved) {
                    if (I18N[saved.lang]) settings.lang = saved.lang;
                    if (/^#[0-9a-f]{6}$/i.test(saved.bg || '')) settings.bg = saved.bg;
                    if (SOUNDS[saved.sound]) settings.sound = saved.sound;
                    if (typeof saved.vibrate === 'boolean') settings.vibrate = saved.vibrate;
                }
            } catch (e) {}
        }

        function applyLanguage() {
            document.documentElement.lang = settings.lang;
            resetBtn.textContent = t('reset');
            startBtn.textContent = t(startState);
            durationBtns.forEach(btn => {
                btn.textContent = btn.dataset.seconds
                    ? btn.dataset.seconds + t('sec')
                    : btn.dataset.minutes + t('min');
            });
            document.getElementById('set-title').textContent = t('settings');
            document.getElementById('set-lang-label').textContent = t('language');
            document.getElementById('set-bg-label').textContent = t('background');
            document.getElementById('set-custom').textContent = t('custom');
            document.getElementById('set-sound-label').textContent = t('sound');
            document.getElementById('set-vib-label').textContent = t('vibration');
            document.getElementById('lbl-min').textContent = t('unit_min');
            document.getElementById('lbl-sec').textContent = t('unit_sec');
            document.getElementById('set-time-btn').textContent = t('set');
            document.querySelectorAll('.sound-btn').forEach(b => {
                b.textContent = b.dataset.sound === 'noodle' ? '🍜 ' + t('noodle_btn') : t('snd_' + b.dataset.sound);
                b.classList.toggle('active', b.dataset.sound === settings.sound);
            });
            document.getElementById('settings-btn').setAttribute('aria-label', t('settings'));
            document.getElementById('settings-close').setAttribute('aria-label', t('close'));
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === settings.lang);
            });
        }

        function applyBg() {
            const color = settings.bg;
            document.body.style.background = color;
            document.querySelector('.meditation-bg').style.background = color;
            // text is always white
            document.documentElement.style.setProperty('--fg', '#ffffff');
            document.documentElement.style.setProperty('--fg-soft', 'rgba(255,255,255,0.7)');
            customColor.value = color;
            document.querySelectorAll('.swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.color === color.toLowerCase());
            });
        }

        COLORS.forEach(c => {
            const s = document.createElement('button');
            s.className = 'swatch';
            s.dataset.color = c;
            s.style.background = c;
            s.setAttribute('aria-label', c);
            s.addEventListener('click', () => {
                settings.bg = c;
                applyBg();
                saveSettings();
            });
            swatchesEl.appendChild(s);
        });

        customColor.addEventListener('input', () => {
            settings.bg = customColor.value;
            applyBg();
            saveSettings();
        });

        document.querySelectorAll('.lang-btn').forEach(b => {
            b.addEventListener('click', () => {
                settings.lang = b.dataset.lang;
                applyLanguage();
                saveSettings();
            });
        });

        document.getElementById('settings-btn').addEventListener('click', () => {
            updateNoodleSoundVisibility();
            settingsOverlay.classList.add('open');
        });
        document.getElementById('settings-close').addEventListener('click', () => settingsOverlay.classList.remove('open'));
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') settingsOverlay.classList.remove('open');
        });

        const soundList = document.getElementById('sound-list');
        Object.keys(SOUNDS).forEach(key => {
            const b = document.createElement('button');
            b.className = 'sound-btn';
            b.dataset.sound = key;
            b.addEventListener('click', () => {
                settings.sound = key;
                document.querySelectorAll('.sound-btn').forEach(x => {
                    x.classList.toggle('active', x.dataset.sound === key);
                });
                saveSettings();
                unlockAudio();
                playCompletionTone(); // preview
            });
            soundList.appendChild(b);
        });

        // Cup noodle (secret): the sound option only shows up while the timer is exactly 3:00.
        // With that sound the alert always shows; otherwise a 3:00 timer has a 5% chance.
        function maybeNoodle() {
            if (selectedDuration === 180 && (settings.sound === 'noodle' || Math.random() < 0.05)) {
                document.getElementById('noodle-text').textContent = t('noodle');
                document.getElementById('noodle-alert').classList.add('show');
            }
        }

        function updateNoodleSoundVisibility() {
            const b = document.querySelector('.sound-btn[data-sound="noodle"]');
            if (!b) return;
            b.style.display = (remainingSeconds === 180 || settings.sound === 'noodle') ? '' : 'none';
        }
        document.getElementById('noodle-alert').addEventListener('click', () => {
            document.getElementById('noodle-alert').classList.remove('show');
        });

        const inMin = document.getElementById('in-min');
        const inSec = document.getElementById('in-sec');

        function applyTimeInput() {
            stopAlarm();
            timerWrapper.classList.remove('pulse-complete');
            const m = Math.max(0, parseInt(inMin.value, 10) || 0);
            const s = Math.max(0, parseInt(inSec.value, 10) || 0);
            const total = Math.min(m * 60 + s, 999 * 60 + 59);
            selectedDuration = total;
            remainingSeconds = total;
            inMin.value = '';
            inSec.value = '';
            updateDisplay();
        }

        document.getElementById('set-time-btn').addEventListener('click', applyTimeInput);
        [inMin, inSec].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') applyTimeInput();
            });
        });

        const vibToggle = document.getElementById('vib-toggle');
        vibToggle.addEventListener('change', () => {
            settings.vibrate = vibToggle.checked;
            saveSettings();
            vibrateNow();
        });
        // devices without vibration support (e.g. iPhone/iPad Safari) don't show the option
        if (!('vibrate' in navigator)) document.getElementById('vib-row').style.display = 'none';

        loadSettings();
        vibToggle.checked = settings.vibrate;
        applyLanguage();
        applyBg();
        updateNoodleSoundVisibility();
        updateDisplay();
    </script>
